<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>theARgame — Connect 4 in the Real World</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="bg"></div>

  <div id="ui-overlay">

    <!-- LOBBY -->
    <div id="lobby" class="panel">

      <div class="logo-wrap">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="white" fill-opacity="0.08"/>
          <path d="M12 28 L26 14 M20 14 L26 14 L26 20" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 22 L22 14" stroke="#c77dff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
        </svg>
        <span class="logo-text">the<em>AR</em>game</span>
      </div>

      <h1>Decode Your City<br>With Augmented Reality</h1>
      <p class="tagline">Location-based AR Connect 4</p>
      <div class="divider"></div>

      <label class="input-label" for="username-input">Your name</label>
      <input id="username-input" type="text" placeholder="Enter a username" maxlength="20" autocomplete="off" />

      <button id="btn-create" onclick="createGame()">Create Game</button>
      <div class="or-divider"><span>or</span></div>
      <button id="btn-join" onclick="document.getElementById(join-section).style.display=block">Join a Game</button>

      <div id="join-section" style="display:none">
        <label class="input-label" for="game-id-input" style="margin-top:10px">Game ID</label>
        <input id="game-id-input" type="text" placeholder="Paste Game ID here" autocomplete="off" />
        <button id="btn-join-confirm" onclick="joinGame()">Join &rarr;</button>
      </div>

      <span id="lobby-error"></span>
    </div>

    <!-- WAITING -->
    <div id="waiting" class="panel" style="display:none">
      <div class="logo-wrap" style="margin-bottom:14px">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <path d="M12 28 L26 14 M20 14 L26 14 L26 20" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Waiting for opponent...</h2>
      <p class="wait-sub">Share this Game ID with a friend</p>
      <div id="share-game-id" class="code-box"></div>
      <button id="btn-copy">Copy Game ID</button>
    </div>

    <!-- STATUS BAR -->
    <div id="status-bar" style="display:none">
      <span id="turn-indicator"></span>
      <span id="move-count"></span>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen" class="panel" style="display:none">
      <h2 id="win-message"></h2>
      <p id="win-sub"></p>
      <button id="btn-new-game">Play Again</button>
    </div>

  </div>

  <span class="hashtag">#theARgame</span>

  <!-- A-FRAME SCENE -->
  <a-scene id="ar-scene" embedded renderer="antialias: true; colorManagement: true;" background="color: #1a0a2e" vr-mode-ui="enabled: true">
    <a-assets timeout="5000"></a-assets>
    <a-light type="ambient" color="#cce8ff" intensity="0.55"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.9" position="3 6 4"></a-light>
    <a-light type="point" color="#9b5de5" intensity="0.5" position="-4 3 2"></a-light>
    <a-light type="point" color="#c77dff" intensity="0.3" position="4 2 2"></a-light>
    <a-sky color="#1a0a2e"></a-sky>
    <a-entity id="camera-rig" position="0 0 8">
      <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true" wasd-controls="enabled: false" fov="70">
        <a-cursor fuse="false" raycaster="objects: .col-hit; far: 20" color="#ffffff" scale="0.5 0.5 0.5"></a-cursor>
      </a-camera>
    </a-entity>
    <a-entity id="board-root"></a-entity>
  </a-scene>

  <script src="game.js"></script>
</body>
</html>
